# Hooper 的博客 - 站级配置
# 改这里就能改全站：站名、Hooper 信息、评论、统计

site:
  name: "Hooper 的博客"
  subtitle: "技术随笔 · AI 实操 · 独立开发"
  description: "记录独立开发、AI Agent 与 AIGC 实践中的思考、经验和复盘。"
  author: "Hooper"
  author_short: "Hooper"
  base_url: "https://hooper.ink"
  blog_path: "/blog/"
  posts_path: "/blog/posts/"
  locale: "zh-CN"
  og_image: "/blog/assets/images/cover-ai-agent-collab-protocol.webp"

# 评论系统（Giscus）
giscus:
  enabled: true
  repo: "hooper3d/hooper.ink"
  repo_id: "R_kgDOSGEnYQ"
  category: "General"
  category_id: "DIC_kwDOSGEnYc4C7Iyy"
  mapping: "pathname"
  strict: "0"
  reactions_enabled: "1"
  emit_metadata: "0"
  input_position: "bottom"
  theme: "preferred_color_scheme"
  lang: "zh-CN"
  loading: "lazy"

# 阅读数（busuanzi 不蒜子）
busuanzi:
  enabled: true
  # 不蒜子纯前端 CDN，无需后端
  js_url: "https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"

# 配色与品牌图标由构建脚本从 Hooper Navi 读取，保持全站一致。
# 输出默认 public/blog；独立预览可使用 build.py --output <目录>。
