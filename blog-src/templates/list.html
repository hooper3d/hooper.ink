<!-- Top Bar -->
<header class="sticky top-0 z-40 glass">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <div class="flex items-center space-x-3">
        <a href="/" class="flex items-center space-x-2 text-slate-700 dark:text-slate-200 hover:text-cyber-500 dark:hover:text-cyber-400 transition-colors">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyber-400 to-cyber-600 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-cyber-500/20">
            <i class="fas fa-paw"></i>
          </div>
          <span class="font-bold">hooper.ink</span>
        </a>
        <span class="text-slate-300 dark:text-slate-700">|</span>
        <span class="text-sm text-slate-500 dark:text-slate-400">博客</span>
      </div>
      <button id="themeToggle" class="p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
        <i class="fas fa-moon text-slate-600 dark:text-slate-300"></i>
      </button>
    </div>
  </div>
</header>

<header class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 pt-12 pb-8 text-center">
  <h1 class="text-4xl md:text-5xl font-bold mb-3">
    <span class="bg-gradient-to-r from-cyber-500 via-emerald-500 to-cyber-500 bg-clip-text text-transparent">Hooper 的博客</span>
  </h1>
  <p class="text-slate-500 dark:text-slate-400 text-lg">技术随笔 · AI 实操 · 独立开发</p>
  <p class="text-xs text-slate-400 dark:text-slate-500 mt-3 italic">「代码 · 文字 · 偶尔的顿悟」</p>
</header>

<main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 pb-12">
  <div id="postsList" class="space-y-6">
    <!-- posts injected by JS -->
  </div>
</main>

<script>
const posts = [
{% for post in posts %}
  {
    title: {{ post.title|tojson }},
    date: {{ post.date|tojson }},
    summary: {{ post.summary|tojson }},
    tags: {{ post.tags|tojson }},
    slug: {{ post.slug|tojson }},
    cover: {{ post.cover|tojson }}
  }{% if not loop.last %},{% endif %}
{% endfor %}
];

function renderPosts() {
  const container = document.getElementById('postsList');
  container.innerHTML = posts.map(post => `
    <article class="card-hover glass rounded-2xl overflow-hidden group">
      <a href="/blog/posts/${post.slug}.html" class="block">
        ${post.cover ? `<div class="h-40 overflow-hidden"><img src="${post.cover}" alt="${post.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy"></div>` : ''}
        <div class="p-6">
          <div class="flex items-center flex-wrap gap-2 text-xs text-slate-400 mb-3">
            <span><i class="far fa-calendar mr-1"></i>${post.date}</span>
            <span>·</span>
            <div class="flex flex-wrap gap-1.5">
              ${post.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
            </div>
          </div>
          <h3 class="text-xl font-bold mb-2 group-hover:text-cyber-500 dark:group-hover:text-cyber-400 transition-colors">${post.title}</h3>
          <p class="text-slate-600 dark:text-slate-400 text-sm leading-relaxed line-clamp-2">${post.summary}</p>
          <div class="mt-4 flex items-center text-sm text-cyber-600 dark:text-cyber-400 font-medium">
            <span>阅读全文</span>
            <i class="fas fa-arrow-right ml-2 transform group-hover:translate-x-1 transition-transform"></i>
          </div>
        </div>
      </a>
    </article>
  `).join('');
}
renderPosts();
</script>
