<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">
  <meta name="keywords" content="{{ keywords }}">
  <meta name="author" content="{{ author }}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ canonical }}">

  <!-- Open Graph -->
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:type" content="{{ og_type }}">
  <meta property="og:url" content="{{ canonical }}">
  <meta property="og:site_name" content="{{ site_name }}">
  <meta property="og:image" content="{{ og_image }}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ title }}">
  <meta name="twitter:description" content="{{ description }}">
  <meta name="twitter:image" content="{{ og_image }}">

  {% if published_time %}<meta property="article:published_time" content="{{ published_time }}">{% endif %}
  {% if author %}<meta property="article:author" content="{{ author }}">{% endif %}

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐅</text></svg>">

  <!-- 依赖 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'Noto Sans SC', 'sans-serif'], serif: ['Noto Serif SC', 'serif'] },
          colors: {
            cyber: { 50:'#f0fdfa', 100:'#ccfbf1', 200:'#99f6e4', 300:'#5eead4', 400:'#2dd4bf', 500:'#14b8a6', 600:'#0d9488', 700:'#0f766e', 800:'#115e59', 900:'#134e4a' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', 'Noto Sans SC', sans-serif; }
    .prose { line-height: 1.85; }
    .prose h2 { font-size: 1.75rem; font-weight: 700; margin-top: 2.5rem; margin-bottom: 1rem; padding-top: 0.5rem; border-top: 1px solid rgba(20,184,166,0.15); scroll-margin-top: 5rem; }
    .prose h3 { font-size: 1.35rem; font-weight: 600; margin-top: 1.75rem; margin-bottom: 0.75rem; scroll-margin-top: 5rem; }
    .prose p { margin-bottom: 1.1rem; }
    .prose a { color: #14b8a6; text-decoration: underline; text-underline-offset: 3px; }
    .prose a:hover { color: #0d9488; }
    .prose blockquote { border-left: 4px solid #14b8a6; padding: 0.5rem 0 0.5rem 1.25rem; margin: 1.5rem 0; color: #475569; background: rgba(20,184,166,0.05); border-radius: 0 0.5rem 0.5rem 0; }
    .dark .prose blockquote { color: #94a3b8; background: rgba(20,184,166,0.08); }
    .prose code { background: rgba(20,184,166,0.12); color: #0d9488; padding: 0.15rem 0.4rem; border-radius: 0.25rem; font-size: 0.9em; font-family: 'SF Mono', 'Monaco', 'Consolas', monospace; }
    .dark .prose code { background: rgba(45,212,191,0.18); color: #5eead4; }
    .prose pre { background: #0f172a !important; border-radius: 0.75rem; padding: 1.25rem; overflow-x: auto; margin: 1.5rem 0; border: 1px solid rgba(20,184,166,0.2); }
    .prose pre code { background: transparent; color: #e2e8f0; padding: 0; font-size: 0.875rem; }
    .prose ul, .prose ol { padding-left: 1.75rem; margin-bottom: 1.1rem; }
    .prose li { margin-bottom: 0.4rem; }
    .prose table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; font-size: 0.9rem; }
    .prose th, .prose td { border: 1px solid rgba(20,184,166,0.2); padding: 0.6rem 0.85rem; text-align: left; }
    .prose th { background: rgba(20,184,166,0.1); font-weight: 600; }
    .prose img { border-radius: 0.5rem; margin: 1.5rem auto; max-width: 100%; }
    .prose hr { border: none; border-top: 1px dashed rgba(20,184,166,0.3); margin: 2rem 0; }
    .glass { background: rgba(255,255,255,0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.3); }
    .dark .glass { background: rgba(15,23,42,0.6); border: 1px solid rgba(148,163,184,0.1); }
    .card-hover { transition: all 0.3s ease; }
    .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -10px rgba(20,184,166,0.2); }
    .bg-grid { background-image: linear-gradient(rgba(20,184,166,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(20,184,146,0.04) 1px, transparent 1px); background-size: 32px 32px; }
    .dark .bg-grid { background-image: linear-gradient(rgba(20,184,166,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(20,184,146,0.06) 1px, transparent 1px); }
    .tag { display: inline-block; padding: 0.125rem 0.625rem; background: rgba(20, 184, 166, 0.1); color: #0d9488; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; margin-right: 0.5rem; }
    .dark .tag { background: rgba(45, 212, 191, 0.15); color: #5eead4; }
    .toc-sidebar { display: none; }
    @media (min-width: 1024px) { .toc-sidebar { display: block; } }
    .toc-link { display: block; padding: 0.25rem 0.5rem; border-radius: 0.375rem; font-size: 0.875rem; color: #64748b; transition: all 0.2s; border-left: 2px solid transparent; }
    .dark .toc-link { color: #94a3b8; }
    .toc-link:hover { color: #0d9488; background: rgba(20,184,166,0.08); }
    .dark .toc-link:hover { color: #2dd4bf; }
    .toc-link.active { color: #0d9488; border-left-color: #14b8a6; background: rgba(20,184,166,0.08); }
    .dark .toc-link.active { color: #2dd4bf; border-left-color: #2dd4bf; }
    .toc-link-h3 { padding-left: 1rem; font-size: 0.8rem; }
    .toc-link-h2 { font-weight: 500; }
    @keyframes breathe { 0%,100% { transform: scale(1);} 50% { transform: scale(1.12);} }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 transition-colors duration-200 bg-grid">
{{ content | safe }}

<!-- Footer -->
<footer class="mt-20 pb-8 text-center text-xs text-slate-400">
  <p>Copyright &copy; 2026 {{ author }} 的数字领地 · 赛博老虎驻守中</p>
  <p class="mt-1">
    <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener" class="hover:text-cyber-400 transition-colors">
      苏ICP备2022029383号-1
    </a>
  </p>
</footer>

<script>
  // Theme
  const themeToggle = document.getElementById('themeToggle');
  function setTheme(dark) {
    if (dark) { document.documentElement.classList.add('dark'); localStorage.setItem('theme','dark'); }
    else { document.documentElement.classList.remove('dark'); localStorage.setItem('theme','light'); }
  }
  if (themeToggle) {
    themeToggle.addEventListener('click', () => setTheme(!document.documentElement.classList.contains('dark')));
  }
  if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    setTheme(true);
  }

  // highlight.js
  if (typeof hljs !== 'undefined') { hljs.highlightAll(); }
</script>

{% if giscus.enabled %}
<!-- Giscus Comments -->
<script>
  (function() {
    const script = document.createElement('script');
    script.src = 'https://giscus.app/client.js';
    script.setAttribute('data-repo', '{{ giscus.repo }}');
    script.setAttribute('data-repo-id', '{{ giscus.repo_id }}');
    script.setAttribute('data-category', '{{ giscus.category }}');
    script.setAttribute('data-category-id', '{{ giscus.category_id }}');
    script.setAttribute('data-mapping', '{{ giscus.mapping }}');
    script.setAttribute('data-strict', '{{ giscus.strict }}');
    script.setAttribute('data-reactions-enabled', '{{ giscus.reactions_enabled }}');
    script.setAttribute('data-emit-metadata', '{{ giscus.emit_metadata }}');
    script.setAttribute('data-input-position', '{{ giscus.input_position }}');
    script.setAttribute('data-theme', '{{ giscus.theme }}');
    script.setAttribute('data-lang', '{{ giscus.lang }}');
    script.setAttribute('data-loading', '{{ giscus.loading }}');
    script.setAttribute('crossorigin', 'anonymous');
    script.async = true;
    document.body.appendChild(script);
  })();
</script>
{% endif %}

{% if busuanzi.enabled %}
<!-- busuanzi 阅读数 -->
<script async src="{{ busuanzi.js_url }}"></script>
{% endif %}
</body>
</html>
