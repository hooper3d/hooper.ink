<!DOCTYPE html>
<html lang="{{ site.locale }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">
  <meta name="author" content="{{ site.author }}">
  <link rel="canonical" href="{{ canonical }}">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:type" content="{% if post is defined %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ canonical }}">
  <meta property="og:site_name" content="{{ site.name }}">
  <meta property="og:image" content="{{ og_image }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ title }}">
  <meta name="twitter:description" content="{{ description }}">
  <meta name="twitter:image" content="{{ og_image }}">
  {% if post is defined %}<meta property="article:published_time" content="{{ post.date }}">{% endif %}
  <link rel="icon" href="/blog/assets/hooper.svg" type="image/svg+xml">
  <script>try { if ((localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark') document.documentElement.classList.add('dark'); } catch { if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark'); }</script>
  <link rel="stylesheet" href="/blog/assets/blog.css?v={{ version }}">
  <script src="/blog/assets/blog.js?v={{ version }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-group">
        <a class="brand" href="/" aria-label="Hooper Navi 首页"><span class="brand-logo" aria-hidden="true"></span><span class="brand-wordmark" aria-hidden="true"></span></a>
        <a class="section-link" href="/blog/" aria-current="{% if post is not defined %}page{% else %}false{% endif %}">博客</a>
      </div>
      <nav class="header-actions" aria-label="网站导航"><a href="/">返回导航</a><button id="themeToggle" class="theme-toggle" type="button" hidden>深色</button></nav>
    </div>
  </header>
  {% block content %}{% endblock %}
  <footer class="site-footer"><span>© {{ year }} {{ site.author }}</span><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">苏ICP备2022029383号-1</a></footer>
  {% if post is defined and busuanzi.get('enabled') %}<script type="application/json" id="readCountConfig">{{ busuanzi.js_url|tojson }}</script>{% endif %}
</body>
</html>
