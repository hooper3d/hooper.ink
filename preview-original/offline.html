<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F3F6FA">
  <title>Hooper Navi · 暂时离线</title>
  <style>
    :root { color-scheme:light dark; --bg:#F3F6FA; --text:#333333; --muted:#6B6B6B; --line:#DEE5EF; }
    @media (prefers-color-scheme:dark) { :root { --bg:#141516; --text:#D8D8D8; --muted:#A3A3A3; --line:#34383E; } }
    body { min-height:100svh; margin:0; display:grid; place-items:center; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; text-align:center; }
    main { padding:24px; } h1 { font-size:22px; font-weight:600; letter-spacing:-.5px; } p { margin:16px 0 24px; color:var(--muted); font-size:14px; }
    button { padding:10px 24px; border:1px solid var(--line); border-radius:10px; background:transparent; color:inherit; font:inherit; cursor:pointer; }
  </style>
</head>
<body><main><h1>Hooper Navi</h1><p>暂时无法连接，联网后重试。</p><button type="button" onclick="location.reload()">重试</button></main></body>
</html>
