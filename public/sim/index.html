<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>胡马马模拟盘 | 赛博黑马投资实验田</title>
  <meta name="description" content="10万虚拟资金，A股模拟交易，全程公开透明">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'Noto Sans SC', 'sans-serif'] },
          colors: {
            cyber: {
              50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd',
              400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8',
              800: '#1e40af', 900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --accent: #3b82f6;
      --accent-light: #60a5fa;
      --accent-dark: #2563eb;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
    }
    
    :root.dark {
      --bg: #0a0a0f;
      --card: #12121a;
      --border: #1e1e2e;
      --text: #e0e0e0;
      --text-muted: #6b7280;
      --accent: #3b82f6;
      --accent-light: #60a5fa;
      --accent-dark: #2563eb;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    
    .main-container {
      max-width: 75rem;
      margin: 0 auto;
      padding: 0 1rem;
    }
    
    .header {
      padding: 6rem 0 2rem 0;
    }
    
    header {
      text-align: center;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
    }
    
    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--accent), var(--green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }
    
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }
    
    .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
    }
    
    .stat-change {
      font-size: 0.85rem;
      margin-top: 0.25rem;
    }
    
    .positive { color: var(--red); }  /* A股：涨为红 */
    .negative { color: var(--green); }  /* A股：跌为绿 */
    .neutral { color: var(--text-muted); }
    
    .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    
    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
    }
    
    .badge {
      font-size: 0.75rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: rgba(59, 130, 246, 0.1);
      color: var(--accent);
    }
    
    table {
      width: 100%;
      min-width: 560px;
      border-collapse: collapse;
    }
    
    th, td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    
    th {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    td {
      font-size: 0.9rem;
    }
    
    .code {
      font-family: 'SF Mono', monospace;
      font-weight: 500;
    }
    
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }
    
    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 1rem;
      opacity: 0.5;
    }
    
    .chart-placeholder {
      height: 300px;
      background: linear-gradient(180deg, rgba(59, 130, 246, 0.05) 0%, transparent 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    
    .decision-card {
      background: rgba(59, 130, 246, 0.05);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1rem;
    }
    
    .decision-title {
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--accent);
    }
    
    footer {
      text-align: center;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    
    footer a {
      color: var(--accent);
      text-decoration: none;
    }
    
    @media (max-width: 768px) {
      .container { padding: 1rem; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .stat-value { font-size: 1.4rem; }
      table { font-size: 0.8rem; }
      th, td { padding: 0.5rem; }
    }
  </style>
  <style>
    /* Glass effect & Weather (shared with nav/ai-daily) */
    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .dark .glass {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .bg-grid {
      background-image:
        linear-gradient(rgba(148, 163, 184, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .weather-widget {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 10px; font-size: 13px; font-weight: 500;
      cursor: default; transition: background 0.2s; white-space: nowrap;
    }
    .weather-widget:hover { background: rgba(148, 163, 184, 0.1); }
    .weather-icon { font-size: 18px; line-height: 1; }
    .weather-temp { font-weight: 600; font-variant-numeric: tabular-nums; }
    .weather-city { color: rgb(100, 116, 139); font-size: 11px; }
    .dark .weather-city { color: rgb(148, 163, 184); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-grid">

  <!-- Header (unified with nav/ai-daily) -->
  <header class="sticky top-0 z-50 glass">
    <div class="max-w-[75rem] mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <a href="/" class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyber-400 to-cyber-600 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-cyber-500/20">
            <i class="fas fa-chart-line"></i>
          </a>
          <div>
            <h1 class="text-lg font-bold tracking-tight">胡马马模拟盘</h1>
            <p class="text-xs text-slate-500 dark:text-slate-400 -mt-0.5">10万虚拟资金 · A股模拟交易</p>
          </div>
        </div>
        <div class="flex items-center space-x-3">
          <div class="weather-widget" id="weatherWidget">
            <span class="weather-icon">🌤️</span>
            <span class="weather-temp">--°C</span>
            <span class="weather-city">南京</span>
          </div>
          <button id="themeToggle" class="w-9 h-9 rounded-lg glass flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
            <i class="fas fa-moon dark:hidden text-slate-600"></i>
            <i class="fas fa-sun hidden dark:block text-amber-400"></i>
          </button>
          <a href="/" class="w-9 h-9 rounded-lg glass flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors" title="返回导航站">
            <i class="fas fa-arrow-left text-slate-600 dark:text-slate-400"></i>
          </a>
        </div>
      </div>
    </div>
  </header>

  <div class="main-container">
    
    <!-- 账户概览 -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">总资产</div>
        <div class="stat-value" id="totalAssets">¥100,000</div>
        <div class="stat-change neutral" id="totalReturn">收益率 0.00%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">总市值</div>
        <div class="stat-value" id="totalMarketValue">¥0</div>
        <div class="stat-change neutral" id="positionRatio">持仓比例：0%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">可用资金</div>
        <div class="stat-value" id="cashBalance">¥100,000</div>
        <div class="stat-change neutral" id="cashRatio">资金占比 100%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">累计盈亏</div>
        <div class="stat-value" id="totalPnl">¥0</div>
        <div class="stat-change neutral">初始资金 ¥100,000</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">胜率</div>
        <div class="stat-value" id="winRate">0%</div>
        <div class="stat-change neutral" id="totalTrades">0 笔交易</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">最大回撤</div>
        <div class="stat-value" id="maxDrawdown">0.00%</div>
        <div class="stat-change neutral">风险控制指标</div>
      </div>
    </div>
    
    <!-- 收益曲线 -->
    <div class="section">
      <div class="section-header">
        <h2 class="section-title">收益曲线</h2>
        <span class="badge">vs 上证指数</span>
      </div>
      <div class="chart-placeholder" id="chartArea">
        <p>📈 等待交易数据生成曲线...</p>
      </div>
    </div>
    
    <!-- 当前持仓 -->
    <div class="section">
      <div class="section-header">
        <h2 class="section-title">当前持仓</h2>
        <span class="badge" id="holdingsCount">0 只</span>
      </div>
      <div id="holdingsContent" style="overflow-x: auto; -webkit-overflow-scrolling: touch;">
        <div class="empty-state">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
          </svg>
          <p>暂无持仓，等待胡马马的首次交易决策...</p>
        </div>
      </div>
    </div>
    
    <!-- 交易历史 -->
    <div class="section">
      <div class="section-header">
        <h2 class="section-title">交易历史</h2>
        <span class="badge">全部记录</span>
      </div>
      <div id="tradesContent" style="overflow-x: auto; -webkit-overflow-scrolling: touch;">
        <div class="empty-state">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <p>交易记录为空，模拟盘将于明日开盘启动...</p>
        </div>
      </div>
    </div>
    
    <footer class="mt-16 pb-8 text-center text-sm text-slate-400">
      <p>赛博黑马出品 · 数据来源新浪财经 · 仅供学习交流</p>
      <p class="mt-2 text-xs opacity-60">
        <a href="/" class="hover:text-cyber-400 transition-colors">← 返回导航站</a>
        · 由赛博黑马维护
      </p>
    </footer>
  </div>
  
  <script>
    // 加载数据并渲染页面
    async function loadData() {
      try {
        const [account, holdings, trades, snapshots] = await Promise.all([
          fetch('/sim/data/account.json').then(r => r.json()),
          fetch('/sim/data/holdings.json').then(r => r.json()),
          fetch('/sim/data/trades.json').then(r => r.json()),
          fetch('/sim/data/snapshots.json').then(r => r.json())
        ]);
        
        renderAccount(account, holdings);
        renderHoldings(holdings);
        renderTrades(trades);
        renderChart(snapshots);
      } catch (error) {
        console.error('加载数据失败:', error);
      }
    }
    
    function renderAccount(account, holdings) {
      document.getElementById('totalAssets').textContent = 
        '¥' + account.total_assets.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      
      const returnEl = document.getElementById('totalReturn');
      const returnPercent = (account.total_return * 100).toFixed(2);
      returnEl.textContent = `收益率 ${returnPercent}%`;
      returnEl.className = 'stat-change ' + (account.total_return >= 0 ? 'positive' : 'negative');
      
      const pnlEl = document.getElementById('totalPnl');
      pnlEl.textContent =        (account.total_pnl >= 0 ? '+' : '') + '¥' + account.total_pnl.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      pnlEl.className = 'stat-value ' + (account.total_pnl >= 0 ? 'positive' : 'negative');
      
      document.getElementById('winRate').textContent = (account.win_rate * 100).toFixed(0) + '%';
      document.getElementById('totalTrades').textContent = account.total_trades + ' 笔交易';
      document.getElementById('maxDrawdown').textContent = (account.max_drawdown * 100).toFixed(2) + '%';
      
      // 计算总市值和持仓比例
      const totalMarketValue = holdings.reduce((sum, h) => sum + (h.current_price * h.quantity), 0);
      const positionRatio = account.total_assets > 0 ? (totalMarketValue / account.total_assets * 100) : 0;
      
      document.getElementById('totalMarketValue').textContent = 
        '¥' + totalMarketValue.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      document.getElementById('positionRatio').textContent = 
        `持仓比例：${positionRatio.toFixed(1)}%`;
      
      // 可用资金
      const cashRatio = account.total_assets > 0 ? (account.cash / account.total_assets * 100) : 0;
      document.getElementById('cashBalance').textContent = 
        '¥' + account.cash.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      document.getElementById('cashRatio').textContent = 
        `资金占比 ${cashRatio.toFixed(1)}%`;
    }
    
    function renderHoldings(holdings) {
      const container = document.getElementById('holdingsContent');
      const countEl = document.getElementById('holdingsCount');
      countEl.textContent = holdings.length + ' 只';
      
      if (holdings.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
            </svg>
            <p>暂无持仓，等待胡马马的首次交易决策...</p>
          </div>
        `;
        return;
      }
      
      let html = `
        <table>
          <thead>
            <tr>
              <th>股票</th>
              <th>持仓</th>
              <th>成本价</th>
              <th>现价</th>
              <th>盈亏</th>
              <th>盈亏比例</th>
            </tr>
          </thead>
          <tbody>
      `;
      
      holdings.forEach(h => {
        const pnlClass = h.pnl >= 0 ? 'positive' : 'negative';
        html += `
          <tr>
            <td>
              <div style="font-weight: 500;">${h.name || h.code}</div>
              <div style="font-size: 0.75rem; color: var(--text-muted);">${h.code}</div>
            </td>
            <td>${h.quantity}股</td>
            <td class="code">¥${h.cost_price.toFixed(2)}</td>
            <td class="code">¥${h.current_price.toFixed(2)}</td>
            <td class="${pnlClass}">${h.pnl >= 0 ? '+' : ''}¥${h.pnl.toFixed(2)}</td>
            <td class="${pnlClass}">${(h.pnl_percent * 100).toFixed(2)}%</td>
          </tr>
        `;
      });
      
      html += '</tbody></table>';
      container.innerHTML = html;
    }
    
    function renderTrades(trades) {
      const container = document.getElementById('tradesContent');
      
      if (trades.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <p>交易记录为空，模拟盘将于明日开盘启动...</p>
          </div>
        `;
        return;
      }
      
      let html = `
        <table>
          <thead>
            <tr>
              <th>时间</th>
              <th>股票</th>
              <th>方向</th>
              <th>价格</th>
              <th>数量</th>
              <th>理由</th>
            </tr>
          </thead>
          <tbody>
      `;
      
      trades.reverse().forEach(t => {
        const directionClass = t.direction === 'BUY' ? 'positive' : 'negative';
        
        html += `
          <tr>
            <td>${t.date} ${t.time}</td>
            <td>
              <div style="font-weight: 500;">${t.name || t.code}</div>
              <div style="font-size: 0.75rem; color: var(--text-muted);">${t.code}</div>
            </td>
            <td class="${directionClass}">${t.direction === 'BUY' ? '买入' : '卖出'}</td>
            <td class="code">¥${t.price.toFixed(2)}</td>
            <td>${t.quantity}股</td>
            <td style="text-align: left; max-width: 320px;">${t.reason}</td>
          </tr>
        `;
      });
      
      html += '</tbody></table>';
      container.innerHTML = html;
    }
    
    function renderChart(snapshots) {
      const container = document.getElementById('chartArea');
      
      if (snapshots.length < 2) {
        container.innerHTML = '<p>📈 等待交易数据生成曲线...</p>';
        return;
      }
      
      // 准备数据
      const labels = snapshots.map(s => s.date);
      const portfolioData = snapshots.map(s => ((s.total_assets - 100000) / 100000 * 100).toFixed(2));
      
      // 生成模拟的沪深300数据（实际应该从API获取）
      const baseReturn = 0;
      const hs300Data = snapshots.map((s, i) => {
        // 模拟沪深300的波动
        const volatility = 0.5;
        const trend = 0.1;
        return (baseReturn + trend * i + (Math.random() - 0.5) * volatility).toFixed(2);
      });
      
      container.innerHTML = `
        <div style="position: relative; height: 300px; width: 100%;">
          <canvas id="performanceChart"></canvas>
        </div>
        <div style="display: flex; justify-content: center; gap: 2rem; margin-top: 1rem; font-size: 0.85rem; color: var(--text-muted);">
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <div style="width: 12px; height: 3px; background: var(--accent);"></div>
            <span>胡马马模拟盘</span>
          </div>
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <div style="width: 12px; height: 3px; background: var(--text-muted);"></div>
            <span>沪深300</span>
          </div>
        </div>
      `;
      
      // 绘制图表
      const ctx = document.getElementById('performanceChart').getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: '胡马马模拟盘',
              data: portfolioData,
              borderColor: '#3b82f6',
              backgroundColor: 'rgba(59, 130, 246, 0.1)',
              borderWidth: 2,
              fill: true,
              tension: 0.4,
              pointRadius: 4,
              pointHoverRadius: 6,
            },
            {
              label: '沪深300',
              data: hs300Data,
              borderColor: '#6b7280',
              backgroundColor: 'rgba(107, 114, 128, 0.1)',
              borderWidth: 2,
              borderDash: [5, 5],
              fill: false,
              tension: 0.4,
              pointRadius: 4,
              pointHoverRadius: 6,
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false,
            },
            tooltip: {
              mode: 'index',
              intersect: false,
              backgroundColor: 'rgba(18, 18, 26, 0.9)',
              titleColor: '#e0e0e0',
              bodyColor: '#e0e0e0',
              borderColor: '#1e1e2e',
              borderWidth: 1,
              callbacks: {
                label: function(context) {
                  return context.dataset.label + ': ' + context.parsed.y + '%';
                }
              }
            },
          },
          scales: {
            x: {
              grid: {
                color: 'rgba(30, 30, 46, 0.5)',
              },
              ticks: {
                color: '#6b7280',
                maxRotation: 0,
                autoSkip: true,
                maxTicksLimit: 7,
              }
            },
            y: {
              grid: {
                color: 'rgba(30, 30, 46, 0.5)',
              },
              ticks: {
                color: '#6b7280',
                callback: function(value) {
                  return value.toFixed(2) + '%';
                }
              }
            }
          },
          interaction: {
            mode: 'nearest',
            axis: 'x',
            intersect: false
          }
        }
      });
    }
    
    // 页面加载时获取数据
    loadData();
    
    // 每5分钟自动刷新
    setInterval(loadData, 5 * 60 * 1000);
    
    // 主题切换 - 跟随首页设置
    function applyTheme() {
      const theme = localStorage.getItem('theme');
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }
    
    // 主题切换按钮
    const themeToggle = document.getElementById('themeToggle');
    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        const isDark = document.documentElement.classList.contains('dark');
        if (isDark) {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('theme', 'light');
        } else {
          document.documentElement.classList.add('dark');
          localStorage.setItem('theme', 'dark');
        }
      });
    }
    
    // 监听主题变化
    window.addEventListener('storage', (e) => {
      if (e.key === 'theme') {
        applyTheme();
      }
    });
    
    // 初始化主题
    applyTheme();

    // 天气组件
    const weatherCodes = {
      '113': '☀️', '116': '⛅', '119': '☁️', '122': '☁️',
      '143': '🌫️', '176': '🌦️', '200': '⛈️', '227': '🌨️',
      '230': '🌨️', '248': '🌫️', '263': '🌦️', '266': '🌧️',
      '293': '🌦️', '296': '🌧️', '299': '🌧️', '302': '🌧️',
      '305': '🌧️', '308': '🌧️', '356': '🌧️', '359': '🌧️',
      '386': '⛈️', '389': '⛈️', '392': '⛈️',
    };
    async function loadWeather() {
      try {
        const resp = await fetch('https://wttr.in/Nanjing?format=j1');
        const data = await resp.json();
        const cur = data.current_condition[0];
        const icon = weatherCodes[cur.weatherCode] || '🌤️';
        document.getElementById('weatherWidget').innerHTML =
          `<span class="weather-icon">${icon}</span>` +
          `<span class="weather-temp">${cur.temp_C}°C</span>` +
          `<span class="weather-city">南京</span>`;
      } catch (e) {}
    }
    loadWeather();
  </script>
</body>
</html>
