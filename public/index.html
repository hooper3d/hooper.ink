  <script>
    // Poetry
    function loadPoetry() {
      const sentenceEl = document.getElementById('poetrySentence');
      const metaEl = document.getElementById('poetryMeta');
      const contentEl = document.getElementById('poetryContent');
      
      // Skeleton loading (#8)
      sentenceEl.innerHTML = '<div class="skeleton h-6 w-64 mx-auto"></div>';
      metaEl.innerHTML = '<div class="skeleton h-4 w-40 mx-auto mt-2"></div>';
      contentEl.style.opacity = '1';
      
      jinrishici.load(function(result) {
        if (result.status === 'success') {
          const data = result.data;
          const origin = data.origin;
          sentenceEl.innerHTML = data.content;
          metaEl.textContent = `【${origin.dynasty}】${origin.author} 《${origin.title}》`;
        } else {
          sentenceEl.innerHTML = '洛阳亲友如相问，一片冰心在玉壶。';
          metaEl.textContent = '【唐代】王昌龄 《芙蓉楼送辛渐》';
        }
        contentEl.style.opacity = '1';
      });
    }

      { title: '个人博客', url: '/blog/', desc: '技术随笔与实操记录', cat: 'my', icon: 'fa-rss', color: 'from-slate-500 to-slate-700' },
      { title: '虚拟交易盘', url: '/sim/', desc: '10万虚拟资金 A股模拟交易', cat: 'my', icon: 'fa-chart-line', color: 'from-emerald-400 to-teal-600', new: true },
      { title: 'A股投研终端', url: 'https://hooper.ink/trading/', desc: '14名AI Agent多智能体投研系统', cat: 'my', icon: 'fa-microchip', color: 'from-violet-400 to-purple-600', new: true },
      { title: '今日 AI 圈', url: '/ai-daily/', desc: 'AI 资讯聚合 · 每日更新', cat: 'my', icon: 'fa-robot', color: 'from-blue-400 to-indigo-600', new: true },
      { title: 'AIGC 视频站', url: 'http://aigc.hooper.ink:6333', desc: 'AI 视频生成学习平台', cat: 'my', icon: 'fa-play', color: 'from-blue-500 to-purple-600', new: true },
    ];

    // State
    let currentCat = 'all';
    let searchQuery = '';

    // Favicon helper (#2)
    function getFaviconUrl(url) {
      try {
        const domain = new URL(url).hostname;
        return `https://favicon.im/${domain}?larger=true`;
      } catch { return null; }
    }

    // Favorites (#7)
    function getFavorites() {
      try { return JSON.parse(localStorage.getItem('nav_favs') || '[]'); } catch { return []; }
    }
    function toggleFav(url, e) {
      e.preventDefault(); e.stopPropagation();
      let favs = getFavorites();
      if (favs.includes(url)) { favs = favs.filter(f => f !== url); }
      else { favs.push(url); }
      localStorage.setItem('nav_favs', JSON.stringify(favs));
      render();
    }

    // DOM
    const grid = document.getElementById('linksGrid');
    const empty = document.getElementById('emptyState');
    const searchInput = document.getElementById('searchInput');
    const catButtons = document.querySelectorAll('.cat-btn');

    // Render card helper
    function renderCard(item, i) {
      const favicon = item.cat === 'my' ? null : getFaviconUrl(item.url);
      const favs = getFavorites();
      const isFav = favs.includes(item.url);
      return `
        <a href="${item.url}" ${item.url.startsWith('http') ? 'target="_blank" rel="noopener"' : ''} 
           class="card-hover glass rounded-2xl p-5 block group fade-in relative" 
           style="animation-delay: ${i * 30}ms">
          ${item.new ? '<span class="badge-new">NEW</span>' : ''}
          <div class="flex items-start space-x-4">
            <div class="relative shrink-0">
              ${favicon 
                ? `<img src="${favicon}" class="favicon-img w-12 h-12 rounded-xl p-1.5 bg-white/80 dark:bg-slate-800/80 shadow group-hover:scale-110 transition-transform" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" loading="lazy">`
                : ''}
              <div class="w-12 h-12 rounded-xl bg-gradient-to-br ${item.color} items-center justify-center text-white text-xl shadow-lg group-hover:scale-110 transition-transform ${favicon ? 'hidden' : 'flex'}">
                <i class="fas ${item.icon}"></i>
              </div>
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="font-semibold text-base truncate group-hover:text-cyber-500 dark:group-hover:text-cyber-400 transition-colors">${item.title}</h3>
              <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5 truncate">${item.desc}</p>
            </div>
            <div class="flex flex-col items-center gap-1 mt-1">
              <i class="fas fa-arrow-up-right-from-square text-xs text-slate-300 dark:text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity"></i>
              <i class="fav-star fas fa-star ${isFav ? 'text-amber-400' : 'text-slate-200 dark:text-slate-700 opacity-0 group-hover:opacity-100'}" onclick="toggleFav('${item.url}', event)"></i>
            </div>
          </div>
        </a>`;
    }

    // Render
    function render() {
      const filtered = navData.filter(item => {
        const matchCat = currentCat === 'all' || item.cat === currentCat;
        const matchSearch = !searchQuery ||
          item.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.desc.toLowerCase().includes(searchQuery.toLowerCase()) ||
          (item.alias && item.alias.toLowerCase().includes(searchQuery.toLowerCase()));
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        grid.classList.add('hidden');
        empty.classList.remove('hidden');
        return;
      }

      grid.classList.remove('hidden');
      empty.classList.add('hidden');

      // Sort: favorites first
      const favs = getFavorites();
      const sorted = [...filtered].sort((a, b) => {
        const aFav = favs.includes(a.url) ? 0 : 1;
        const bFav = favs.includes(b.url) ? 0 : 1;
        return aFav - bFav;
      });

      grid.innerHTML = sorted.map((item, i) => renderCard(item, i)).join('');
    }

    // Events
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      render();
    });

    // Search shortcut - Enter to search engine
    searchInput.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const query = searchInput.value.trim();
      if (!query) return;
      
      const engines = {
        '!g': 'https://www.google.com/search?q=',
        '!b': 'https://www.bing.com/search?q=',
        '!d': 'https://duckduckgo.com/?q=',
        '!gh': 'https://github.com/search?q=',
        '!y': 'https://www.youtube.com/results?search_query=',
        '!bd': 'https://www.baidu.com/s?wd=',
        '!tb': 'https://s.taobao.com/search?q=',
        '!zh': 'https://www.zhihu.com/search?type=content&q=',
      };
      
      for (const [prefix, url] of Object.entries(engines)) {
        if (query.startsWith(prefix + ' ')) {
          window.open(url + encodeURIComponent(query.slice(prefix.length + 1)), '_blank');
          searchInput.value = '';
          searchQuery = '';
          render();
          return;
        }
      }
      
      // Default: Google
      window.open('https://www.google.com/search?q=' + encodeURIComponent(query), '_blank');
      searchInput.value = '';
      searchQuery = '';
      render();
    });

    catButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        currentCat = btn.dataset.cat;
        catButtons.forEach(b => {
          b.classList.remove('bg-cyber-500', 'text-white', 'shadow-lg', 'shadow-cyber-500/20');
          b.classList.add('glass', 'hover:bg-slate-200', 'dark:hover:bg-slate-800');
        });
        btn.classList.remove('glass', 'hover:bg-slate-200', 'dark:hover:bg-slate-800');
        btn.classList.add('bg-cyber-500', 'text-white', 'shadow-lg', 'shadow-cyber-500/20');
        render();
      });
    });

    // Theme
    const themeToggle = document.getElementById('themeToggle');
    function setTheme(dark) {
      if (dark) {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      } else {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      }
    }
    themeToggle.addEventListener('click', () => {
      setTheme(!document.documentElement.classList.contains('dark'));
    });
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      setTheme(true);
    }

    // Update time (if element exists)
    const updateTimeEl = document.getElementById('updateTime');
    if (updateTimeEl) {
      updateTimeEl.textContent = new Date().toLocaleDateString('zh-CN');
    }

    // Initial render
    render();

    // Weather widget
    const weatherCodes = {
      '113': '☀️', '116': '⛅', '119': '☁️', '122': '☁️',
      '143': '🌫️', '176': '🌦️', '179': '🌨️', '182': '🌨️',
      '185': '🌨️', '200': '⛈️', '227': '🌨️', '230': '🌨️',
      '248': '🌫️', '260': '🌫️', '263': '🌦️', '266': '🌧️',
      '281': '🌨️', '284': '🌨️', '293': '🌦️', '296': '🌧️',
      '299': '🌧️', '302': '🌧️', '305': '🌧️', '308': '🌧️',
      '311': '🌨️', '314': '🌨️', '317': '🌨️', '320': '🌨️',
      '323': '🌨️', '326': '🌨️', '329': '❄️', '332': '❄️',
      '335': '❄️', '338': '❄️', '350': '🌨️', '353': '🌦️',
      '356': '🌧️', '359': '🌧️', '362': '🌨️', '365': '🌨️',
      '368': '🌨️', '371': '❄️', '374': '🌨️', '377': '🌨️',
      '386': '⛈️', '389': '⛈️', '392': '⛈️', '395': '❄️'
    };
    async function loadWeather() {
      try {
        const resp = await fetch('https://wttr.in/Nanjing?format=j1');
        const data = await resp.json();
        const cur = data.current_condition[0];
        const code = cur.weatherCode;
        const icon = weatherCodes[code] || '🌤️';
        const temp = cur.temp_C;
        document.getElementById('weatherWidget').innerHTML = 
          `<span class="weather-icon">${icon}</span>` +
          `<span class="weather-temp">${temp}°C</span>` +
          `<span class="weather-city">南京</span>`;

        // Render 3-day forecast
        const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
        const forecastHtml = data.weather.map(day => {
          const d = new Date(day.date);
          const today = new Date();
          const isToday = d.toDateString() === today.toDateString();
          const label = isToday ? '今天' : weekdays[d.getDay()];
          const noonCode = day.hourly[4]?.weatherCode || day.hourly[0]?.weatherCode || '113';
          const dayIcon = weatherCodes[noonCode] || '🌤️';
          return `<div class="forecast-day">
            <span class="forecast-date">${label}</span>
            <span class="forecast-icon">${dayIcon}</span>
            <span class="forecast-temp">${day.maxtempC}° <span class="low">/ ${day.mintempC}°</span></span>
          </div>`;
        }).join('');
        document.getElementById('weatherForecast').innerHTML = forecastHtml;
      } catch (e) {
        console.log('Weather load failed:', e);
      }
    }
    loadWeather();

    // Keyboard shortcuts (/ to focus search, Esc to clear)
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      }
      if (e.key === 'Escape' && document.activeElement === searchInput) {
        searchInput.value = '';
        searchQuery = '';
        render();
      }
    });
  </script>
</body>
</html>
