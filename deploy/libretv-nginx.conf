server {
    listen 80;
    server_name tv.hooper.ink;
    location ^~ /.well-known/acme-challenge/ {
        root /home/agentuser/nav/public;
        try_files $uri/index.html $uri =404;
    }
    location / {
        return 301 https://tv.hooper.ink$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name tv.hooper.ink;
    ssl_certificate /etc/letsencrypt/live/tv.hooper.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tv.hooper.ink/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / {
        proxy_pass http://127.0.0.1:18874;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 90s;
    }
}
